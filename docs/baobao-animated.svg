<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <style>
      .body { animation: breathe 3.2s ease-in-out infinite; transform-origin: 200px 290px; }
      .sprout { animation: sprout-bounce 2.1s ease-in-out infinite; transform-origin: 200px 108px; }
      .scarf-tail { animation: scarf-sway 2.8s ease-in-out infinite; transform-origin: 222px 272px; }
      .eye-l { animation: blink 4.5s ease-in-out infinite; transform-origin: 176px 228px; }
      .eye-r { animation: blink 4.5s ease-in-out infinite; transform-origin: 226px 228px; }
      .blush { animation: blush-fade 3.2s ease-in-out infinite; }

      @keyframes breathe {
        0%,100% { transform: scaleY(1) scaleX(1); }
        50%      { transform: scaleY(1.022) scaleX(0.988); }
      }
      @keyframes sprout-bounce {
        0%,100% { transform: translateY(0) rotate(-4deg); }
        50%      { transform: translateY(-5px) rotate(4deg); }
      }
      @keyframes scarf-sway {
        0%,100% { transform: rotate(-8deg); }
        50%      { transform: rotate(8deg); }
      }
      @keyframes blink {
        0%,88%,100% { transform: scaleY(1); }
        92%          { transform: scaleY(0.08); }
      }
      @keyframes blush-fade {
        0%,100% { opacity: 0.45; }
        50%      { opacity: 0.65; }
      }
    </style>
    <!-- soft shadow for body -->
    <radialGradient id="shadow" cx="50%" cy="90%" r="38%">
      <stop offset="0%" stop-color="#00000022"/>
      <stop offset="100%" stop-color="#00000000"/>
    </radialGradient>
    <!-- sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8e0f7"/>
      <stop offset="100%" stop-color="#dff1fb"/>
    </linearGradient>
    <!-- body shading -->
    <radialGradient id="bodyShade" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff55"/>
      <stop offset="100%" stop-color="#00000010"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="480" fill="url(#sky)"/>
  <!-- ground -->
  <ellipse cx="200" cy="430" rx="180" ry="38" fill="#8ecf6a"/>
  <rect x="20" y="428" width="360" height="60" fill="#8ecf6a"/>

  <!-- ground shadow -->
  <ellipse cx="200" cy="424" rx="120" ry="18" fill="url(#shadow)"/>

  <!-- BODY GROUP (breathing) -->
  <g class="body">

    <!-- legs -->
    <ellipse cx="170" cy="390" rx="28" ry="22" fill="#2d2d2d"/>
    <ellipse cx="230" cy="390" rx="28" ry="22" fill="#2d2d2d"/>
    <!-- foot pads -->
    <ellipse cx="165" cy="400" rx="16" ry="10" fill="#fff1df"/>
    <ellipse cx="235" cy="400" rx="16" ry="10" fill="#fff1df"/>

    <!-- body -->
    <ellipse cx="200" cy="300" rx="88" ry="96" fill="#fbf6ee"/>
    <ellipse cx="200" cy="300" rx="88" ry="96" fill="url(#bodyShade)"/>

    <!-- belly -->
    <ellipse cx="200" cy="318" rx="52" ry="58" fill="#fff8ee"/>

    <!-- shoulder patches -->
    <ellipse cx="148" cy="260" rx="28" ry="22" fill="#2d2d2d" opacity="0.85"/>
    <ellipse cx="252" cy="260" rx="28" ry="22" fill="#2d2d2d" opacity="0.85"/>

    <!-- arms -->
    <ellipse cx="136" cy="310" rx="20" ry="34" fill="#2d2d2d" transform="rotate(-12,136,310)"/>
    <ellipse cx="264" cy="310" rx="20" ry="34" fill="#2d2d2d" transform="rotate(12,264,310)"/>
    <!-- arm paw pads -->
    <ellipse cx="128" cy="336" rx="12" ry="9" fill="#fff1df"/>
    <ellipse cx="272" cy="336" rx="12" ry="9" fill="#fff1df"/>

    <!-- scarf ring -->
    <ellipse cx="200" cy="248" rx="70" ry="20" fill="none" stroke="#b48fdf" stroke-width="20" stroke-opacity="0.92"/>
    <!-- scarf tail -->
    <rect class="scarf-tail" x="215" y="258" width="18" height="46" rx="6" fill="#b48fdf"/>
    <!-- scarf highlight -->
    <ellipse cx="200" cy="242" rx="62" ry="10" fill="none" stroke="#d4b8f5" stroke-width="6" stroke-opacity="0.5"/>

    <!-- head -->
    <ellipse cx="200" cy="200" rx="76" ry="70" fill="#fbf6ee"/>
    <ellipse cx="200" cy="200" rx="76" ry="70" fill="url(#bodyShade)"/>

    <!-- ears -->
    <circle cx="142" cy="148" r="26" fill="#2d2d2d"/>
    <circle cx="258" cy="148" r="26" fill="#2d2d2d"/>
    <!-- ear inner -->
    <circle cx="142" cy="150" r="14" fill="#3d3030"/>
    <circle cx="258" cy="150" r="14" fill="#3d3030"/>

    <!-- eye patches -->
    <ellipse cx="176" cy="208" rx="22" ry="26" fill="#2d2d2d" transform="rotate(-10,176,208)"/>
    <ellipse cx="224" cy="208" rx="22" ry="26" fill="#2d2d2d" transform="rotate(10,224,208)"/>

    <!-- eyes (blinking) -->
    <g class="eye-l">
      <circle cx="176" cy="228" r="11" fill="white"/>
      <circle cx="176" cy="228" r="7" fill="#111"/>
      <circle cx="179" cy="225" r="3" fill="white"/>
      <circle cx="173" cy="231" r="1.5" fill="white"/>
    </g>
    <g class="eye-r">
      <circle cx="224" cy="228" r="11" fill="white"/>
      <circle cx="224" cy="228" r="7" fill="#111"/>
      <circle cx="227" cy="225" r="3" fill="white"/>
      <circle cx="221" cy="231" r="1.5" fill="white"/>
    </g>

    <!-- blush -->
    <ellipse class="blush" cx="155" cy="246" rx="18" ry="10" fill="#ff8fb0"/>
    <ellipse class="blush" cx="245" cy="246" rx="18" ry="10" fill="#ff8fb0"/>

    <!-- nose -->
    <ellipse cx="200" cy="246" rx="9" ry="6" fill="#2a1b24"/>

    <!-- mouth smile -->
    <path d="M190,258 Q200,266 210,258" fill="none" stroke="#7a2840" stroke-width="2.5" stroke-linecap="round"/>

    <!-- sprout stem + leaf -->
    <g class="sprout">
      <line x1="200" y1="132" x2="200" y2="108" stroke="#5c9a3f" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="192" cy="106" rx="10" ry="6" fill="#7fcf5a" transform="rotate(-30,192,106)"/>
      <ellipse cx="208" cy="104" rx="10" ry="6" fill="#7fcf5a" transform="rotate(30,208,104)"/>
    </g>

    <!-- tail -->
    <circle cx="200" cy="390" r="16" fill="#fbf6ee"/>

  </g>
</svg>
